spring.application.name=AgentForge
server.port=8080

# Database Configuration with PostgreSQL / H2 Automatic Fallback
spring.datasource.url=${DB_URL:jdbc:h2:mem:agentforge_db;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true
spring.sql.init.mode=never

# H2 Console (for debugging and inspecting tables)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Security
app.jwt.secret=${JWT_SECRET:AgentForgeSecretKeyForJwtSigningMustBeAtLeast256BitsLongSecure12345}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Settings
ai.provider=${AI_PROVIDER:AUTO}
ai.model=${AI_MODEL:gemini-1.5-pro}
gemini.api.key=${GEMINI_API_KEY:}
openai.api.key=${OPENAI_API_KEY:}
ai.mock-mode=${AI_MOCK_MODE:false}

# Orchestrator Configuration
agentforge.orchestrator.max-self-healing-retries=${MAX_SELF_HEALING_RETRIES:2}
agentforge.orchestrator.max-agent-retries=${MAX_AGENT_RETRIES:2}
agentforge.orchestrator.require-requirements-approval=${REQUIRE_REQUIREMENTS_APPROVAL:true}
agentforge.orchestrator.require-architecture-approval=${REQUIRE_ARCHITECTURE_APPROVAL:true}

# Async Thread Pool
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=AgentExecutor-
