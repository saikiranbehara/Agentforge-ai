version: '3.8'

services:
  # ==========================================
  # PostgreSQL with pgvector extension
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge -d agentforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # AgentForge Spring Boot 3.x Backend Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: agentforge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agentforge
      SPRING_DATASOURCE_USERNAME: agentforge
      SPRING_DATASOURCE_PASSWORD: agentforge_secret
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: never
      AGENTFORGE_AI_PROVIDER: ${AI_PROVIDER:-MOCK}
      AGENTFORGE_AI_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENTFORGE_AI_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENTFORGE_AI_MODEL: ${AI_MODEL:-gemini-1.5-pro}
      AGENTFORGE_SANDBOX_TYPE: PROCESS
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: 86400000

  # ==========================================
  # AgentForge React + Vite Frontend (Nginx Proxy)
  # Note: The Backend JAR also embeds and serves the SPA directly on :8080
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: agentforge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
    driver: local
